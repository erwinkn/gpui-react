[package]
name = "gpui-react-texture-example"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
gpui-react = { path = "../../crates/gpui-react" }
gpui-react-controls = { path = "../../crates/gpui-react-controls" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"

[dev-dependencies]
gpui = { path = "../../zed/crates/gpui", default-features = false, features = ["font-kit", "test-support"] }
gpui_macos = { path = "../../zed/crates/gpui_macos", default-features = false, features = ["font-kit", "test-support"] }

[profile.release]
debug = 1
