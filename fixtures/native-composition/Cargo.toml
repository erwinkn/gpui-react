[package]
name = "gpuix-extension-example"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace]

[lib]
crate-type = ["cdylib"]

[features]
default = ["test-support"]
test-support = ["gpuix-native/test-support"]

[dependencies]
gpuix-native = { path = "../../packages/native", default-features = false }
serde_json = "1"
anyhow = "1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
napi = { version = "3", features = ["napi8"] }
napi-derive = "3"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "=0.2.127"
wgpu = { version = "29.0.4", features = ["webgl"] }

[build-dependencies]
napi-build = "2"
