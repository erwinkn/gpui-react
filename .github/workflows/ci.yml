name: CI

on:
  push:
    branches:
      - main
    tags-ignore:
      - "**"
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - "**/*.gitignore"
  pull_request: null

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 3

jobs:
  test:
    name: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Test crates
        run: |
          cargo test --manifest-path crates/gpui-react/Cargo.toml
          cargo test --manifest-path crates/gpui-react-controls/Cargo.toml
          cargo test --manifest-path crates/gpui-react-host/Cargo.toml

      - name: Check runtime and fixtures
        run: |
          cargo check --manifest-path crates/gpui-react-runtime/Cargo.toml
          cargo check --manifest-path fixtures/bridge-performance/Cargo.toml
          cargo check --manifest-path fixtures/bridge-performance/Cargo.toml --features allocation-counts
          cargo check --manifest-path fixtures/bridge-gpu-component/Cargo.toml
          cargo check --manifest-path fixtures/bridge-counter/Cargo.toml

      - name: Clippy
        run: |
          cargo clippy --manifest-path crates/gpui-react/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path crates/gpui-react-controls/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path crates/gpui-react-host/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path crates/gpui-react-runtime/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path fixtures/bridge-performance/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path fixtures/bridge-gpu-component/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path fixtures/bridge-counter/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Build and test packages
        run: |
          bun run --cwd packages/bridge build
          bun run --cwd packages/bridge test
          bun run --cwd packages/bridge-controls build
