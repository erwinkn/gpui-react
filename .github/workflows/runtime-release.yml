name: Fork runtime release

on:
  push:
    branches: [cherry/native-extensions]
    paths:
      - .github/workflows/runtime-release.yml
      - scripts/package-runtime.ts
      - scripts/test-runtime-packages.ts
  workflow_dispatch:
    inputs:
      version:
        description: Fork prerelease version
        required: true
        default: 0.9.0-cherry.1

permissions:
  contents: read

concurrency:
  group: fork-runtime-release
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 3
  GPUIX_BACKGROUND: 1
  RUNTIME_VERSION: ${{ inputs.version || '0.9.0-cherry.1' }}

jobs:
  build-test:
    if: github.repository == 'erwinkn/gpuix'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - name: Install browser and Metal toolchains
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -downloadComponent MetalToolchain
          rustup toolchain install nightly --profile minimal --component rust-src --target wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
          npm install --global agent-browser@0.31.1
          agent-browser install
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build native runtime and React
        run: |
          bun run build
          cargo check --locked --all-targets --manifest-path packages/native/Cargo.toml
      - name: Test React and examples
        run: |
          cd packages/react
          bun run test --maxWorkers=1
          cd ../../examples
          bun run test --maxWorkers=1
      - name: Test external native composition and worker host
        run: |
          bun fixtures/native-composition/build.ts
          bun fixtures/native-composition/test.ts
          bun fixtures/native-composition/test-host.ts
      - name: Build default browser runtime
        working-directory: packages/native
        run: |
          cargo +nightly build --locked --release --no-default-features --target wasm32-unknown-unknown
          wasm-bindgen "$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/gpuix_native.wasm" --target web --out-dir wasm --out-name gpuix-web
      - name: Test external browser composition on WebGPU and WebGL
        run: |
          bun fixtures/native-composition/build.ts --wasm
          bunx tsc -p fixtures/native-composition/tsconfig.json
          bun fixtures/native-composition/server.ts > "$RUNNER_TEMP/composition-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4187/ > /dev/null; then break; fi
            sleep 1
          done
          bun fixtures/native-composition/test-browser.ts
      - name: Pack and test installed runtime archives
        run: |
          bun scripts/package-runtime.ts "$RUNTIME_VERSION"
          bun scripts/test-runtime-packages.ts
          bun fixtures/native-composition/test-package-browser.ts
          bun -e 'if (JSON.parse(await Bun.file("dist/runtime/runtime-manifest.json").text()).sourceDirty) throw new Error("Release checkout changed during build")'
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-packages
          path: dist/runtime/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composition-evidence
          path: |
            packages/react/screenshots/extension-composition/
            ${{ runner.temp }}/composition-server.log

  publish:
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: runtime-packages
          path: runtime
      - name: Publish tested archives to the fork release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: erwinkn/gpuix
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const manifest = JSON.parse(fs.readFileSync('runtime/runtime-manifest.json'));
          if (manifest.sourceDirty || manifest.source !== process.env.SOURCE_SHA || manifest.version !== process.env.RUNTIME_VERSION) throw new Error('Release provenance mismatch');
          for (const item of manifest.packages) {
            const hash = crypto.createHash('sha256').update(fs.readFileSync('runtime/' + item.filename)).digest('hex');
            if (hash !== item.sha256) throw new Error('Archive checksum mismatch: ' + item.filename);
          }
          fs.writeFileSync('notes.md', `Shared GPUiX runtime.\n\nSource: ${manifest.source}\nGPUI: ${manifest.gpui}\n\nThe default native binary supports macOS arm64. Browser files support WebGPU and WebGL. Consumer native extensions must use a composed binding through the runtime loader.\n\nCI checked native and browser composition, the native worker host, and isolated Node and Bun package installs. See runtime-manifest.json for SHA-256 hashes.\n`);
          NODE
          tag="runtime-v$RUNTIME_VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release already exists; refusing to replace its assets"
            exit 1
          fi
          gh release create "$tag" runtime/*.tgz runtime/runtime-manifest.json --target "$SOURCE_SHA" --title "GPUiX runtime $RUNTIME_VERSION" --notes-file notes.md
