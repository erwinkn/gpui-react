[package]
name = "gpui-react-host"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Native-owned application host for gpui-react"

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
gpui-react = { path = "../gpui-react" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
napi = { version = "3", features = ["napi8"] }
napi-derive = "3"

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { path = "../../zed/crates/gpui_macos", default-features = false, features = ["font-kit"] }
objc = "0.2"
signal-hook = "0.3"

[build-dependencies]
napi-build = "2"

[profile.release]
debug = 1
