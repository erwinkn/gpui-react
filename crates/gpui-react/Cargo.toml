[package]
name = "gpui-react"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Small asynchronous React bindings for ordinary GPUI views"

[workspace]

[dependencies]
gpui = { path = "../../zed/crates/gpui", default-features = false, features = ["font-kit"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
anyhow = "1"
rustc-hash = "2"
csscolorparser = "0.8.3"

[dev-dependencies]
gpui = { path = "../../zed/crates/gpui", default-features = false, features = ["font-kit", "test-support"] }

[profile.release]
debug = 1
