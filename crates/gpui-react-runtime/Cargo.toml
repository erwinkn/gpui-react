[package]
name = "gpui-react-runtime"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Default native composition for the asynchronous GPUI React bridge"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
gpui-react-host = { path = "../gpui-react-host" }
gpui-react-controls = { path = "../gpui-react-controls" }
napi = { version = "3", features = ["napi8"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[profile.release]
debug = 1
