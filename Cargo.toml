[workspace]
resolver = "3"
members = [
  "crates/gpui-react",
  "crates/gpui-react-macros",
  "crates/gpui-react-kit",
  "crates/gpui-react-runtime",
  "fixtures/counter",
  "fixtures/gpu-component",
  "fixtures/performance",
]
exclude = ["zed"]

[workspace.dependencies]
gpui = { path = "zed/crates/gpui", default-features = false, features = ["font-kit"] }
gpui_macos = { path = "zed/crates/gpui_macos", default-features = false, features = ["font-kit"] }
napi = { version = "3", features = ["napi8"] }
napi-derive = "3"
napi-build = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rustc-hash = "2"
csscolorparser = "0.8.3"

[profile.release]
debug = 1